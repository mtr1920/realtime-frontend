<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xumane Recruit - AI-powered recruitment platform" />
    <title>Xumane Recruit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-blocking font loading: loads as print, switches to all on load -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
    <!-- Inline critical CSS for instant loading skeleton -->
    <style>
      /* Theme CSS variables - must match index.css exactly */
      :root {
        --il-bg: hsl(0 0% 100%);
        --il-primary: hsl(221.2 83.2% 53.3%);
        --il-muted-fg: hsl(215 20% 40%);
      }
      .dark {
        --il-bg: hsl(222.2 84% 4.9%);
        --il-primary: hsl(217.2 91.2% 59.8%);
        --il-muted-fg: hsl(215 15% 72%);
      }
      .high-contrast {
        --il-bg: hsl(0 0% 0%);
        --il-primary: hsl(48 100% 50%);
        --il-muted-fg: hsl(0 0% 80%);
      }

      /* Initial loader styles */
      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 1rem;
        background-color: var(--il-bg);
        transition: opacity 0.2s ease-out;
      }
      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Dots loader */
      .dots-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .dots-loader .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: var(--il-primary);
        animation: bounce 0.6s ease-in-out infinite;
      }
      .dots-loader .dot:nth-child(1) {
        animation-delay: -0.3s;
      }
      .dots-loader .dot:nth-child(2) {
        animation-delay: -0.15s;
      }
      .dots-loader .dot:nth-child(3) {
        animation-delay: 0s;
      }

      @keyframes bounce {
        0%, 80%, 100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      #initial-loader .message {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.875rem;
        color: var(--il-muted-fg);
        margin: 0;
      }

      /* Respect reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        .dots-loader .dot {
          animation: none;
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
    <!-- Anti-flash script: Set theme before render -->
    <script>
      (function() {
        // Parse Zustand persisted state from 'ui-storage' key
        var theme = 'system';
        try {
          var stored = localStorage.getItem('ui-storage');
          if (stored) {
            var parsed = JSON.parse(stored);
            theme = parsed.state && parsed.state.theme ? parsed.state.theme : 'system';
          }
        } catch (e) {}

        // Resolve system preference
        var systemIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolvedTheme = theme === 'system'
          ? (systemIsDark ? 'dark' : 'light')
          : theme;

        // Apply class to html element immediately
        if (resolvedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (resolvedTheme === 'high-contrast') {
          document.documentElement.classList.add('high-contrast');
        }

        // Handle reduced motion preference
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('reduce-motion');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- CSS-only loading skeleton - replaced by React on mount -->
      <div id="initial-loader" role="status" aria-live="polite" aria-busy="true">
        <div class="dots-loader" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <p class="message">Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
